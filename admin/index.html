<section class="page"><div class="wrap"><h1>写文章</h1><p class="page-intro">这是一个轻量发文助手：填写内容后自动生成符合 Jekyll 规范的 Markdown。它不会保存 GitHub 密钥，也不会直接修改仓库；生成后复制内容，再打开 GitHub 新建文章即可。</p><div class="admin-grid"><div><div class="field"><label>文章标题</label><input id="title" placeholder="例如：我如何设计一个可维护的 PHP 系统"></div><div class="field"><label>分类</label><input id="category" value="技术" placeholder="技术 / 随笔 / 教育科技"></div><div class="field"><label>标签</label><input id="tags" placeholder="PHP, MySQL, 项目管理"></div><div class="field"><label>摘要</label><textarea id="description" rows="3" placeholder="首页会显示这段摘要"></textarea></div><div class="field"><label>正文（Markdown）</label><textarea id="body" rows="18" placeholder="## 二级标题&#10;&#10;这里开始写正文……"></textarea></div><div class="actions"><button class="btn primary" id="copyBtn" type="button">复制 Markdown</button><button class="btn" id="downloadBtn" type="button">下载 .md</button><a class="btn" id="githubBtn" href="https://github.com/SinceJack/blog/new/main/_posts" target="_blank" rel="noreferrer">打开 GitHub 发布 ↗</a></div><p class="meta" id="msg">文件名会自动按当前日期生成，你只需要在 GitHub 中粘贴内容并 Commit changes。</p></div><div><strong>生成预览</strong><pre id="preview" class="preview"></pre></div></div></div></section><script>(function(){const ids=['title','category','tags','description','body'];const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));const preview=document.getElementById('preview'),msg=document.getElementById('msg');function esc(s){return String(s||'').replace(/"/g,'\\"')}function slug(s){return String(s||'post').trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'')||'post'}function dateParts(){const d=new Date(),p=n=>String(n).padStart(2,'0');return {date:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),time:p(d.getHours())+':'+p(d.getMinutes())+':00'}}function build(){const d=dateParts();const tags=els.tags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);const fm=['---','layout: post','title: "'+esc(els.title.value||'未命名文章')+'"','date: '+d.date+' '+d.time+' +0800','category: '+(els.category.value.trim()||'随笔'),'tags: ['+tags.map(t=>'"'+esc(t)+'"').join(', ')+']','description: "'+esc(els.description.value)+'"','---','',''+els.body.value];const text=fm.join('\n');preview.textContent=text;return {text,filename:d.date+'-'+slug(els.title.value)+'.md'}}ids.forEach(id=>els[id].addEventListener('input',build));document.getElementById('copyBtn').onclick=async()=>{const x=build();await navigator.clipboard.writeText(x.text);msg.textContent='已复制 Markdown。现在点击“打开 GitHub 发布”，填写文件名 '+x.filename+'，粘贴并提交即可。'};document.getElementById('downloadBtn').onclick=()=>{const x=build(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x.text],{type:'text/markdown;charset=utf-8'}));a.download=x.filename;a.click();URL.revokeObjectURL(a.href)};build()})();</script>
